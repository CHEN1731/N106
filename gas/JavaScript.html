<script>
  var lastResult = null;

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.add('hidden'); }, 2600);
  }

  // Load an uploaded .txt file into its textarea (editable afterwards).
  function wireUpload(fileId, textId) {
    $(fileId).addEventListener('change', function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { $(textId).value = reader.result; };
      reader.readAsText(f);
    });
  }
  wireUpload('fileRto', 'rtoText');

  // AIS pane accepts Word (.docx) or .txt. Word files are converted to text on
  // the server (Docx.gs); .txt is read locally. Everything is wrapped so a
  // failure only shows a message and never breaks the page.
  $('fileSamsung').addEventListener('change', function (e) {
    var note = $('aisNote');
    try {
      var f = e.target.files[0];
      if (!f) return;
      var isWord = /\.docx?$/i.test(f.name);

      if (!isWord) {
        var reader = new FileReader();
        reader.onerror = function () { if (note) note.textContent = 'Could not read ' + f.name; };
        reader.onload = function () { $('samsungText').value = reader.result; if (note) note.textContent = 'Loaded ' + f.name; };
        reader.readAsText(f);
        return;
      }

      // Old .doc (binary, pre-2007) is not a zip — we can't read it.
      if (/\.doc$/i.test(f.name)) {
        if (note) note.textContent = 'Old .doc not supported — please "Save As" .docx, or paste the text.';
        toast('Please use .docx (not .doc), or paste the text.');
        return;
      }
      // Server converter must exist in the DEPLOYED version.
      if (!(window.google && google.script && google.script.run &&
            typeof google.script.run.docxToText === 'function')) {
        if (note) note.textContent = 'Word upload not available — redeploy the web app (New version), then reload.';
        toast('Redeploy the web app to enable Word upload.');
        return;
      }
      // Guard very large files (google.script.run has payload limits).
      if (f.size > 20 * 1024 * 1024) {
        if (note) note.textContent = 'File too large (' + Math.round(f.size/1048576) + ' MB) — export text-only or paste it.';
        toast('Word file too large — paste the text instead.');
        return;
      }

      if (note) note.textContent = 'Reading ' + f.name + '…';
      var r = new FileReader();
      r.onerror = function () { if (note) note.textContent = 'Could not read ' + f.name + ' (file error).'; };
      r.onload = function () {
        try {
          var res = String(r.result || '');
          var comma = res.indexOf(',');
          var b64 = comma >= 0 ? res.slice(comma + 1) : res; // strip data: prefix
          google.script.run
            .withSuccessHandler(function (text) {
              $('samsungText').value = text || '';
              if (note) note.textContent = 'Loaded ' + f.name + ' (' + (text ? text.length : 0) + ' chars) — edit if needed';
            })
            .withFailureHandler(function (err) {
              var m = (err && err.message) ? err.message : 'unknown error';
              if (note) note.textContent = 'Could not read ' + f.name + ': ' + m;
              toast('Word read failed: ' + m);
            })
            .docxToText(b64, f.name);
        } catch (inner) {
          if (note) note.textContent = 'Upload error: ' + inner.message;
          toast('Upload error: ' + inner.message);
        }
      };
      r.readAsDataURL(f);
    } catch (outer) {
      if (note) note.textContent = 'Upload error: ' + outer.message;
      toast('Upload error: ' + outer.message);
    }
  });

  $('btnCompare').addEventListener('click', function () {
    var rto = $('rtoText').value, sam = $('samsungText').value;
    if (!rto.trim() || !sam.trim()) { toast('Paste or upload both exports first.'); return; }
    var reportDate = $('reportDate') ? $('reportDate').value : '';  // yyyy-mm-dd or ''
    $('btnCompare').disabled = true; $('btnCompare').textContent = 'Comparing…';
    google.script.run
      .withSuccessHandler(onResult)
      .withFailureHandler(function (err) {
        $('btnCompare').disabled = false; $('btnCompare').textContent = 'Compare';
        toast('Error: ' + err.message);
      })
      .runComparison(rto, sam, reportDate);
  });

  function onResult(res) {
    lastResult = res;
    $('btnCompare').disabled = false; $('btnCompare').textContent = 'Compare';
    $('btnSave').disabled = false;
    $('results').classList.remove('hidden');

    var o = res.overall;
    $('scAccuracy').textContent = o.accuracyPct + '%';
    $('scMatched').textContent = o.matched;
    $('scConflict').textContent = o.conflicts;
    $('scMissing').textContent = o.missing;
    $('scTotal').textContent = o.total;
    $('parseNote').textContent =
      'Parsed ' + res.rtoCount + ' RTO and ' + res.samsungCount + ' Samsung records.';

    // Populate the date filter.
    var dates = res.daily.map(function (d) { return d.date; });
    var sel = $('fltDate');
    sel.innerHTML = '<option value="">All</option>' +
      dates.map(function (d) { return '<option>' + d + '</option>'; }).join('');

    renderRows();
  }

  ['fltDate', 'fltStatus'].forEach(function (id) {
    $(id).addEventListener('change', renderRows);
  });

  function renderRows() {
    if (!lastResult) return;
    var d = $('fltDate').value, st = $('fltStatus').value;
    var body = $('cmpTable').querySelector('tbody');
    body.innerHTML = '';
    lastResult.rows
      .filter(function (r) { return (!d || r.date === d) && (!st || r.status === st); })
      .forEach(function (r) {
        var tr = document.createElement('tr');
        tr.className = r.status;
        tr.innerHTML =
          td(r.date) + td(r.area) +
          '<td><span class="pill ' + r.status + '">' + label(r.status) + '</span></td>' +
          td(r.similarity) +
          td(r.rtoActivity) + td(r.samsungActivity) +
          td(r.rtoRemark) + td(r.samsungRemark) +
          td((r.rtoPhotos || 0) + ' / ' + (r.samsungPhotos || 0));
        body.appendChild(tr);
      });
  }

  function td(v) {
    return '<td>' + String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</td>';
  }
  function label(s) {
    return s === 'MissingRTO' ? 'Missing · RTO'
      : s === 'MissingSamsung' ? 'Missing · AIS' : s;
  }

  $('btnSave').addEventListener('click', function () {
    if (!lastResult) return;
    $('btnSave').disabled = true; $('btnSave').textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function (url) {
        $('btnSave').disabled = false; $('btnSave').textContent = 'Save to Sheet';
        toast('Saved. Sheet: ' + url);
      })
      .withFailureHandler(function (err) {
        $('btnSave').disabled = false; $('btnSave').textContent = 'Save to Sheet';
        toast('Save failed: ' + err.message);
      })
      .saveToSheet(lastResult);
  });
</script>
