<script>
  var lastResult = null;

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.add('hidden'); }, 2600);
  }

  // Convert Word document.xml -> readable text (same logic as Docx.gs, run in
  // the browser so large files never hit the server payload limit).
  function docxXmlToTextClient(xml) {
    var s = String(xml)
      .replace(/<w:tab\b[^>]*\/?>/g, '\t')
      .replace(/<w:br\b[^>]*\/?>/g, '\n')
      .replace(/<\/w:p>/g, '\n')
      .replace(/<[^>]+>/g, '')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(parseInt(n, 10)); })
      .replace(/&#x([0-9a-fA-F]+);/g, function (_, n) { return String.fromCharCode(parseInt(n, 16)); })
      .replace(/&amp;/g, '&')
      .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
    return s.trim();
  }

  // Load an uploaded .txt file into its textarea (editable afterwards).
  function wireUpload(fileId, textId) {
    $(fileId).addEventListener('change', function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { $(textId).value = reader.result; };
      reader.readAsText(f);
    });
  }
  wireUpload('fileRto', 'rtoText');

  // AIS pane accepts Word (.docx) or .txt. Word files are converted to text on
  // the server (Docx.gs); .txt is read locally. Everything is wrapped so a
  // failure only shows a message and never breaks the page.
  $('fileSamsung').addEventListener('change', function (e) {
    var note = $('aisNote');
    try {
      var f = e.target.files[0];
      if (!f) return;
      var isWord = /\.docx?$/i.test(f.name);

      if (!isWord) {
        var reader = new FileReader();
        reader.onerror = function () { if (note) note.textContent = 'Could not read ' + f.name; };
        reader.onload = function () { $('samsungText').value = reader.result; if (note) note.textContent = 'Loaded ' + f.name; };
        reader.readAsText(f);
        return;
      }

      // Old .doc (binary, pre-2007) is not a zip — we can't read it.
      if (/\.doc$/i.test(f.name)) {
        if (note) note.textContent = 'Old .doc not supported — please "Save As" .docx, or paste the text.';
        toast('Please use .docx (not .doc), or paste the text.');
        return;
      }
      if (note) note.textContent = 'Reading ' + f.name + '…';

      // Preferred path: unzip in the browser with JSZip and extract only the
      // document text — handles any file size, no server round-trip.
      if (window.JSZip) {
        var ab = new FileReader();
        ab.onerror = function () { if (note) note.textContent = 'Could not read ' + f.name + ' (file error).'; };
        ab.onload = function () {
          JSZip.loadAsync(ab.result)
            .then(function (zip) {
              var entry = zip.file('word/document.xml');
              if (!entry) throw new Error('No word/document.xml — not a .docx?');
              return entry.async('string');
            })
            .then(function (xml) {
              var text = docxXmlToTextClient(xml);
              $('samsungText').value = text;
              if (note) note.textContent = 'Loaded ' + f.name + ' (' + text.length + ' chars) — edit if needed';
            })
            .catch(function (err) {
              if (note) note.textContent = 'Could not read ' + f.name + ': ' + (err && err.message || err);
              toast('Word read failed: ' + (err && err.message || err));
            });
        };
        ab.readAsArrayBuffer(f);
        return;
      }

      // Fallback (JSZip not loaded): send to the server (small files only).
      if (!(window.google && google.script && google.script.run &&
            typeof google.script.run.docxToText === 'function')) {
        if (note) note.textContent = 'Word upload unavailable — redeploy the web app, or paste the text.';
        toast('Redeploy the web app, or paste the text.');
        return;
      }
      if (f.size > 20 * 1024 * 1024) {
        if (note) note.textContent = 'File too large and JSZip unavailable — paste the text instead.';
        toast('Too large — paste the text.');
        return;
      }
      var r = new FileReader();
      r.onerror = function () { if (note) note.textContent = 'Could not read ' + f.name + ' (file error).'; };
      r.onload = function () {
        try {
          var res = String(r.result || '');
          var comma = res.indexOf(',');
          var b64 = comma >= 0 ? res.slice(comma + 1) : res; // strip data: prefix
          google.script.run
            .withSuccessHandler(function (text) {
              $('samsungText').value = text || '';
              if (note) note.textContent = 'Loaded ' + f.name + ' (' + (text ? text.length : 0) + ' chars) — edit if needed';
            })
            .withFailureHandler(function (err) {
              var m = (err && err.message) ? err.message : 'unknown error';
              if (note) note.textContent = 'Could not read ' + f.name + ': ' + m;
              toast('Word read failed: ' + m);
            })
            .docxToText(b64, f.name);
        } catch (inner) {
          if (note) note.textContent = 'Upload error: ' + inner.message;
          toast('Upload error: ' + inner.message);
        }
      };
      r.readAsDataURL(f);
    } catch (outer) {
      if (note) note.textContent = 'Upload error: ' + outer.message;
      toast('Upload error: ' + outer.message);
    }
  });

  $('btnCompare').addEventListener('click', function () {
    var rto = $('rtoText').value, sam = $('samsungText').value;
    if (!rto.trim() || !sam.trim()) { toast('Paste or upload both exports first.'); return; }
    var reportDate = $('reportDate') ? $('reportDate').value : '';  // yyyy-mm-dd or ''
    $('btnCompare').disabled = true; $('btnCompare').textContent = 'Comparing…';
    google.script.run
      .withSuccessHandler(onResult)
      .withFailureHandler(function (err) {
        $('btnCompare').disabled = false; $('btnCompare').textContent = 'Compare';
        toast('Error: ' + err.message);
      })
      .runComparison(rto, sam, reportDate);
  });

  function onResult(res) {
    lastResult = res;
    $('btnCompare').disabled = false; $('btnCompare').textContent = 'Compare';
    $('btnSave').disabled = false;
    $('results').classList.remove('hidden');

    var p = res.productivityData || {};
    $('scDW').textContent = p.dWallCount || 0;
    $('scBP').textContent = p.bPileCount || 0;
    $('scBT').textContent = p.bWallCount || 0;
    $('scCW').textContent = p.cWallCount || 0;
    $('scCon').textContent = p.totalConcreteVolumeM3 || 0;
    $('scMP').textContent = p.totalManpower || 0;

    var acts = res.mergedActivities || [];
    var msg = 'Merged ' + acts.length + ' activit' + (acts.length === 1 ? 'y' : 'ies')
      + (res.reportDate ? ' for ' + res.reportDate : '')
      + ' · ' + (res.usedAi ? 'AI extraction' : 'offline parser') + '.';
    if (!acts.length) {
      msg += res.usedAi
        ? '  ⚠ 0 activities — check the reports have content for this date.'
        : '  ⚠ 0 activities — set ANTHROPIC_API_KEY so the Word report can be read (offline can\'t parse a .docx).';
    }
    $('parseNote').textContent = msg;

    renderRows();
  }

  function renderRows() {
    if (!lastResult) return;
    var body = $('cmpTable').querySelector('tbody');
    body.innerHTML = '';
    (lastResult.mergedActivities || []).forEach(function (a) {
      var tr = document.createElement('tr');
      tr.innerHTML = td(a.area) + td(a.section) + td(a.activity) + td(a.manpower || 0);
      body.appendChild(tr);
    });
  }

  function td(v) {
    return '<td>' + String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</td>';
  }

  $('btnSave').addEventListener('click', function () {
    if (!lastResult) return;
    $('btnSave').disabled = true; $('btnSave').textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function (url) {
        $('btnSave').disabled = false; $('btnSave').textContent = 'Save to Sheet';
        toast('Saved. Sheet: ' + url);
      })
      .withFailureHandler(function (err) {
        $('btnSave').disabled = false; $('btnSave').textContent = 'Save to Sheet';
        toast('Save failed: ' + err.message);
      })
      .saveToSheet(lastResult);
  });
</script>
