<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1a1c1f; --muted: #6b7280;
    --line: #e3e6ea; --brand: #1f6feb;
    --rto: #2563eb; --samsung: #7c3aed;
    --match: #15803d; --match-bg: #e7f6ec;
    --conflict: #b45309; --conflict-bg: #fdf1de;
    --missing: #b91c1c; --missing-bg: #fbe9e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 16px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 17px; margin: 0; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; gap: 8px; }
  button {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 20px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .tag { font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 999px; color: #fff; }
  .tag.rto { background: var(--rto); }
  .tag.samsung { background: var(--samsung); }
  .file { font-size: 12px; color: var(--brand); cursor: pointer; }
  .file input { display: none; }
  textarea {
    width: 100%; height: 42vh; min-height: 260px; resize: vertical; border: 0; outline: none;
    padding: 12px; font: 12.5px/1.5 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    white-space: pre; overflow: auto;
  }

  .results { padding: 4px 20px 40px; }
  .results.hidden { display: none; }
  .scorecards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 12px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  .card .num { font-size: 24px; font-weight: 700; }
  .card .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .filters { display: flex; gap: 16px; align-items: center; margin: 8px 0 12px; flex-wrap: wrap; }
  .filters label { font-size: 12.5px; color: var(--muted); }
  .filters select { margin-left: 6px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); font-size: 13px; }
  .note { color: var(--muted); font-size: 12px; }

  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #fafbfc; position: sticky; top: 0; font-weight: 600; white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 11.5px; white-space: nowrap; }
  .pill.Match { color: var(--match); background: var(--match-bg); }
  .pill.Conflict { color: var(--conflict); background: var(--conflict-bg); }
  .pill.MissingRTO, .pill.MissingSamsung { color: var(--missing); background: var(--missing-bg); }
  tr.Conflict td { background: #fffdf7; }
  tr.MissingRTO td, tr.MissingSamsung td { background: #fff8f8; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1a1c1f; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 20;
  }
  .hidden { display: none; }

  @media (max-width: 820px) {
    .panes { grid-template-columns: 1fr; }
    .scorecards { grid-template-columns: repeat(2, 1fr); }
  }
</style>
