<script>
  var ACTS = [];   // merged activities [{_row,date,area,section,elementId,activity,manpower,sourceEvidence}]
  var PROD = [];    // productivity history (asc by date)
  var ALL_DATES = [];  // every known date, oldest -> newest
  var concreteChart = null, structChart = null;
  var editingRow = null;   // _row of the activity currently being edited (or null)
  var AREA_KPI = {};       // per-area KPI computed each render (for back-check click)
  var kpiFilter = null;    // {area, type:'DW'|'BP'|'BT'|'CW', ids:[]} — back-check filter

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function attr(s){ return esc(s).replace(/"/g,'&quot;'); }
  function actByRow(r){ for(var i=0;i<ACTS.length;i++) if(ACTS[i]._row===r) return ACTS[i]; return null; }

  // --- back-check helpers: derive element IDs + per-area KPI from the activities ---
  var CE_RE = /\b(?:DW[-\s]?\d+[A-Za-z]?|BP[-\s]?[A-Za-z0-9]+(?:-[A-Za-z0-9]+)?|BT[-\s]?\d+(?:-\d+)?|CW[-\s]?\d+|T\d+-\d+)\b/gi;
  function elementIdsOf(a){
    var blob = (a.elementId||'')+' '+(a.activity||'');
    var m = blob.match(CE_RE) || [], seen={}, out=[];
    m.forEach(function(c){ var n=c.toUpperCase().replace(/\s+/g,''); if(!seen[n]){seen[n]=1;out.push(n);} });
    return out;
  }
  function classifyEl(id){ var s=String(id).toUpperCase();
    if(/^DW/.test(s))return'DW'; if(/^BT/.test(s))return'BT'; if(/^CW/.test(s))return'CW';
    if(/^BP/.test(s)||/^T\d+-\d+$/.test(s))return'BP'; return''; }
  function sumConcrete(t){ var re=/(\d+(?:\.\d+)?)\s*(?:m3|m³|cum|cu\.?\s?m)(?![a-z0-9])/gi,m,s=0;
    while((m=re.exec(String(t)))!==null)s+=parseFloat(m[1]); return s; }
  // Concrete CASTING volume: exclude LSS/backfill; "X/Y m3" -> current cast X; else
  // a plain "N m3" only in a casting context. Caller keeps the latest per panel.
  // Progressive X/Y with the m3 unit on either or both sides -> current cast X.
  var PROG_RE=/(\d+(?:\.\d+)?)\s*(?:m3|m³|cum|cu\.?\s?m)?\s*\/\s*\d+(?:\.\d+)?\s*(?:m3|m³|cum|cu\.?\s?m)(?![a-z0-9])/gi;
  function castVolume(t){
    // drop LSS/backfill clauses (even in X/Y form), keep the rest
    var cl=String(t||'').split(/\s*(?:\+|;|,|\band\b|\bthen\b|\n)\s*/i), kept=[];
    for(var i=0;i<cl.length;i++){ if(/\blss\b/i.test(cl[i])||/back\s*fill/i.test(cl[i])) continue; kept.push(cl[i]); }
    var clean=kept.join(' ');
    var best=0,m; PROG_RE.lastIndex=0;
    while((m=PROG_RE.exec(clean))!==null) best=Math.max(best,parseFloat(m[1]));
    if(best) return best;
    if(/\b(cast|concret|pour)/i.test(clean))
      return sumConcrete(clean.replace(/theoretical\s*\d+(?:\.\d+)?\s*(?:m3|m³|cum|cu\.?\s?m)/gi,' '));
    return 0; }
  function areaKpiOf(list){
    var dw={},bp={},bt={},cw={},man=0,castByPanel={};
    list.forEach(function(a){
      elementIdsOf(a).forEach(function(id){ var t=classifyEl(id);
        if(t==='DW')dw[id]=1; else if(t==='BP')bp[id]=1; else if(t==='BT')bt[id]=1; else if(t==='CW')cw[id]=1; });
      var vol=castVolume(a.activity||'');
      if(vol>0){ var panel=String(a.elementId||'').toUpperCase().replace(/\s+/g,'')||
        ('SEC:'+(a.section||'')+'|'+String(a.activity||'').slice(0,24));
        castByPanel[panel]=Math.max(castByPanel[panel]||0,vol); }
      man += Number(a.manpower)||0;
    });
    var conc=0; Object.keys(castByPanel).forEach(function(p){ conc+=castByPanel[p]; });
    return { DW:Object.keys(dw), BP:Object.keys(bp), BT:Object.keys(bt), CW:Object.keys(cw),
             concrete:Math.round(conc*100)/100, manpower:man };
  }
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.remove('hidden');
    clearTimeout(t._h); t._h=setTimeout(function(){t.classList.add('hidden');},2600); }
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888'; }

  function load(){
    if (window.__MOCK__){ onData(window.__MOCK__); return; }
    if (typeof window.__REPORT__ !== 'undefined' && window.__REPORT__ !== null){
      if (window.__REPORT__.error){ $('src').textContent='ERROR: '+window.__REPORT__.error; return; }
      onData(window.__REPORT__); return;
    }
    if (!(window.google && google.script && google.script.run)){ $('src').textContent='no data source'; return; }
    $('src').textContent='loading…';
    google.script.run.withSuccessHandler(onData)
      .withFailureHandler(function(e){ $('src').textContent='ERROR: '+(e&&e.message||e); })
      .getReport();
  }

  function onData(report){
    ACTS = (report && report.activities) || [];
    PROD = ((report && report.productivity) || []).slice().sort(function(a,b){
      return String(a.date)<String(b.date)?-1:(String(a.date)>String(b.date)?1:0); });
    var name = (report && report.spreadsheetName) || '(no sheet)';
    var ver = window.__APPV__ ? ' · ' + window.__APPV__ : '';
    $('src').textContent = PROD.length + ' days · ' + name + ver;

    // All known dates, oldest -> newest, for the From / To range pickers.
    ALL_DATES = uniq(PROD.map(function(p){return p.date;}).concat(ACTS.map(function(a){return String(a.date);})))
      .sort();
    // From: "(earliest)" + dates; To: "(latest)" + dates. Default = All dates.
    $('fFrom').innerHTML = '<option value="">(earliest)</option>' +
      ALL_DATES.map(function(d){return '<option value="'+esc(d)+'">'+esc(fmtDate(d))+'</option>';}).join('');
    $('fTo').innerHTML = '<option value="">(latest)</option>' +
      ALL_DATES.map(function(d){return '<option value="'+esc(d)+'">'+esc(fmtDate(d))+'</option>';}).join('');
    // Area options from activities.
    var areas = uniq(ACTS.map(function(a){return String(a.area||'');}).filter(Boolean)).sort();
    $('fArea').innerHTML = '<option value="">All areas</option>' +
      areas.map(function(a){return '<option>'+esc(a)+'</option>';}).join('');

    render();
  }

  function uniq(list){ var s={},o=[]; list.forEach(function(v){ if(v!=='' && !s[v]){s[v]=1;o.push(v);} }); return o; }

  // "2026-08-22" -> "22 Aug 2026"; anything else returned unchanged.
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(d){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||''));
    if (!m) return String(d||'');
    return String(Number(m[3])) + ' ' + MONTHS[Number(m[2])-1] + ' ' + m[1];
  }

  ['fFrom','fTo','fArea'].forEach(function(id){ $(id).addEventListener('change', function(){ editingRow=null; render(); }); });
  $('fSearch').addEventListener('input', render);
  $('fAll').addEventListener('click', function(){ $('fFrom').value=''; $('fTo').value=''; editingRow=null; render(); });
  $('reload').addEventListener('click', function(){
    if (window.__REPORT__ !== undefined && !window.__MOCK__) location.reload(); else load();
  });

  function prodForDate(d){
    for (var i=0;i<PROD.length;i++) if (String(PROD[i].date)===String(d)) return PROD[i];
    return null;
  }

  // The dates currently selected by the From/To range (blank bound = open).
  function selectedDates(){
    var from=$('fFrom').value, to=$('fTo').value;
    return ALL_DATES.filter(function(d){ return (!from||d>=from) && (!to||d<=to); });
  }

  function rangeLabel(dates){
    if (!dates.length) return 'no data';
    if (dates.length===1) return fmtDate(dates[0]);
    return fmtDate(dates[0]) + ' – ' + fmtDate(dates[dates.length-1]);
  }

  // Aggregate productivity over a set of dates. Counts = distinct active codes
  // across the period (union of the stored lists); concrete & manpower = sums.
  function aggregateProd(dates){
    if (dates.length===1){
      return prodForDate(dates[0]) ||
        {dWallCount:0,bPileCount:0,bWallCount:0,cWallCount:0,concreteM3:0,totalManpower:0};
    }
    var u={dw:{},bp:{},bt:{},cw:{}}, con=0, mp=0, mx={dw:0,bp:0,bt:0,cw:0};
    dates.forEach(function(d){
      var p=prodForDate(d); if(!p) return;
      con += p.concreteM3||0; mp += p.totalManpower||0;
      (p.activeDWalls||[]).forEach(function(x){ if(x) u.dw[x.toLowerCase()]=1; });
      (p.activeBoredPiles||[]).forEach(function(x){ if(x) u.bp[x.toLowerCase()]=1; });
      (p.activeButtressWalls||[]).forEach(function(x){ if(x) u.bt[x.toLowerCase()]=1; });
      (p.activeCrossWalls||[]).forEach(function(x){ if(x) u.cw[x.toLowerCase()]=1; });
      mx.dw=Math.max(mx.dw,p.dWallCount||0); mx.bp=Math.max(mx.bp,p.bPileCount||0);
      mx.bt=Math.max(mx.bt,p.bWallCount||0); mx.cw=Math.max(mx.cw,p.cWallCount||0);
    });
    return {
      dWallCount: Object.keys(u.dw).length || mx.dw,
      bPileCount: Object.keys(u.bp).length || mx.bp,
      bWallCount: Object.keys(u.bt).length || mx.bt,
      cWallCount: Object.keys(u.cw).length || mx.cw,
      concreteM3: con, totalManpower: mp
    };
  }

  function render(){
    var dates = selectedDates();
    var selSet={}; dates.forEach(function(d){ selSet[d]=1; });
    var multi = dates.length !== 1;
    var p = aggregateProd(dates);
    $('kDW').textContent = p.dWallCount||0;
    $('kBP').textContent = p.bPileCount||0;
    $('kBT').textContent = p.bWallCount||0;
    $('kCW').textContent = p.cWallCount||0;
    $('kCon').textContent = p.concreteM3||0;
    $('kMP').textContent = p.totalManpower||0;
    $('doughDate').textContent = rangeLabel(dates);
    if ($('concSub')) $('concSub').textContent = multi
      ? ('Concrete cast per day · ' + rangeLabel(dates))
      : 'Daily concrete casting';

    renderActivities(selSet, multi);
    renderConcreteChart(dates);
    renderStructChart(p);
  }

  function renderActivities(selSet, multi){
    var area=$('fArea').value, q=$('fSearch').value.trim().toLowerCase();
    var rows = ACTS.filter(function(a){
      if (selSet && !selSet[String(a.date)]) return false;
      if (area && String(a.area)!==area) return false;
      if (q){ var hay=(a.section+' '+a.activity).toLowerCase(); if(hay.indexOf(q)===-1) return false; }
      return true;
    });
    $('ctx').textContent = rows.length + ' activit' + (rows.length===1?'y':'ies');
    // group by area (Area 1..4 then Others)
    var ORDER = ['Area 1','Area 2','Area 3','Area 4','Others'];
    var groups={}, order=[];
    rows.forEach(function(a){ var g=a.area||'Others'; if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(a); });
    order.sort(function(x,y){ var ix=ORDER.indexOf(x),iy=ORDER.indexOf(y); return (ix<0?99:ix)-(iy<0?99:iy)||(x<y?-1:1); });
    // within a group, newest date first when several days are shown
    if (multi) order.forEach(function(g){ groups[g].sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); }); });
    AREA_KPI = {};
    var host=$('areas');
    if(!rows.length){ host.innerHTML='<div class="areagroup"><div class="empty">No activities for this filter.</div></div>'; return; }
    var dateHead = multi ? '<th>Date</th>' : '';
    host.innerHTML = order.map(function(g){
      var k = areaKpiOf(groups[g]); AREA_KPI[g] = k;
      var shown = groups[g];
      var filtered = kpiFilter && kpiFilter.area===g;
      if (filtered){
        var idset={}; kpiFilter.ids.forEach(function(id){idset[id]=1;});
        shown = groups[g].filter(function(a){ return elementIdsOf(a).some(function(id){return idset[id];}); });
      }
      var kpis = '<div class="kpirow">'+
        kpiBadge(g,'DW',k.DW.length)+kpiBadge(g,'BP',k.BP.length)+
        kpiBadge(g,'BT',k.BT.length)+kpiBadge(g,'CW',k.CW.length)+
        '<span class="kbadge stat">Concrete '+k.concrete+' m³</span>'+
        '<span class="kbadge stat">Manpower '+k.manpower+'</span></div>';
      var notice = filtered ? '<div class="kfilter">Back-check · <b>'+esc(kpiFilter.type)+'</b>: '+
        esc(kpiFilter.ids.join(', ')||'—')+' — showing '+shown.length+' of '+groups[g].length+
        ' <button class="kclear">✕ clear</button></div>' : '';
      var body = shown.map(function(a){ return activityRowHtml(a, multi); }).join('') ||
        '<tr><td class="empty" colspan="'+(multi?6:5)+'">No matching activities for this KPI.</td></tr>';
      return '<div class="areagroup"><h3>'+esc(g)+' · '+groups[g].length+'</h3>'+ kpis + notice +
        '<div class="tablewrap"><table><thead><tr>'+dateHead+'<th>Section</th><th>Element</th>'+
        '<th>Activity</th><th>Manpower</th><th class="acts"></th></tr></thead>'+
        '<tbody>'+body+'</tbody></table></div></div>';
    }).join('');
  }

  function kpiBadge(area, type, count){
    var active = kpiFilter && kpiFilter.area===area && kpiFilter.type===type;
    return '<button class="kbadge '+type.toLowerCase()+(active?' active':'')+'" data-area="'+attr(area)+
      '" data-type="'+type+'" title="Back-check: show only '+type+' activities in this area">'+
      count+' '+type+'</button>';
  }

  // One activity row: read-only, or an editable form when it is the editing row.
  // `multi` adds a leading Date column when several days are shown.
  function areaOptions(cur){
    var opts = ['', 'Area 1', 'Area 2', 'Area 3', 'Area 4', 'Others'];
    if (cur && opts.indexOf(cur) === -1) opts.push(cur);   // keep any non-standard value
    return opts.map(function(o){
      return '<option value="'+attr(o)+'"'+(o===(cur||'')?' selected':'')+'>'+
        esc(o===''?'(unassigned)':o)+'</option>';
    }).join('');
  }

  function activityRowHtml(a, multi){
    var dateCell = multi ? '<td class="mono">'+esc(fmtDate(a.date))+'</td>' : '';
    if (a._row === editingRow){
      var cols = multi ? 6 : 5;
      return '<tr class="editing" data-row="'+a._row+'"><td colspan="'+cols+'">'+
        '<div class="editrow">'+
          (multi ? '<span class="edate">'+esc(fmtDate(a.date))+'</span>' : '')+
          '<label>Area <select class="e-area">'+areaOptions(a.area)+'</select></label>'+
          '<label>Section <input class="e-sec" value="'+attr(a.section||'')+'"></label>'+
          '<label>Element <input class="e-elem" value="'+attr(a.elementId||'')+'"></label>'+
          '<label class="grow">Activity <input class="e-act" value="'+attr(a.activity||'')+'"></label>'+
          '<label>Manpower <input class="e-mp" type="number" min="0" step="1" value="'+(a.manpower||0)+'"></label>'+
          '<button class="e-save">Save</button> <button class="e-cancel">Cancel</button>'+
        '</div></td></tr>';
    }
    return '<tr data-row="'+a._row+'">'+ dateCell +'<td>'+esc(a.section||'—')+'</td>'+
      '<td class="mono">'+esc(a.elementId||'—')+'</td>'+
      '<td class="act">'+esc(a.activity||'')+'</td>'+
      '<td class="mono">'+(a.manpower||0)+'</td>'+
      '<td class="acts"><button class="e-edit" title="Edit this record">✎ Edit</button>'+
      '<button class="e-del" title="Delete this record">🗑</button></td></tr>';
  }

  // Delegated clicks: KPI back-check badges, clear, and inline edit/delete.
  $('areas').addEventListener('click', function(ev){
    var btn = ev.target;
    // Back-check: click a KPI badge -> filter that area's table to those element IDs.
    if (btn.classList && btn.classList.contains('kbadge') && btn.getAttribute('data-type')){
      var area = btn.getAttribute('data-area'), type = btn.getAttribute('data-type');
      var ids = (AREA_KPI[area] && AREA_KPI[area][type]) || [];
      if (kpiFilter && kpiFilter.area===area && kpiFilter.type===type) kpiFilter = null; // toggle off
      else kpiFilter = { area:area, type:type, ids:ids };
      render(); return;
    }
    if (btn.classList && btn.classList.contains('kclear')){ kpiFilter = null; render(); return; }
    var tr = btn.closest && btn.closest('tr[data-row]');
    if (!tr) return;
    var rowId = Number(tr.getAttribute('data-row'));
    if (btn.classList.contains('e-edit')){ editingRow = rowId; render(); }
    else if (btn.classList.contains('e-cancel')){ editingRow = null; render(); }
    else if (btn.classList.contains('e-save')){ saveEdit(rowId, tr); }
    else if (btn.classList.contains('e-del')){ deleteRow(rowId); }
  });

  function deleteRow(rowId){
    var a = actByRow(rowId); if(!a) return;
    if (!window.confirm('Delete this activity?\n\n' + (a.section||'') + ' — ' + (a.activity||''))) return;
    var edit = { row: rowId, orig:{ section:a.section, activity:a.activity, manpower:a.manpower } };
    if (!(window.google && google.script && google.script.run)){
      ACTS = ACTS.filter(function(x){ return x._row!==rowId; }); render(); toast('Deleted (local)'); return;
    }
    google.script.run
      .withSuccessHandler(function(){ toast('Deleted.'); reloadData(); })
      .withFailureHandler(function(e){ toast('Delete failed: ' + (e && e.message || e)); })
      .deleteActivity(edit);
  }

  // Add-activity form.
  $('addToggle').addEventListener('click', function(){
    var f = $('addForm'); f.hidden = !f.hidden;
    if (!f.hidden){
      // default the date to the current single selection, else the latest day
      var sel = selectedDates();
      $('aDate').value = (sel.length===1 ? sel[0] : (ALL_DATES[ALL_DATES.length-1]||''));
      $('aSection').value=''; $('aElement').value=''; $('aActivity').value=''; $('aManpower').value='0';
      $('aArea').value='';
      $('aActivity').focus();
    }
  });
  $('aCancel').addEventListener('click', function(){ $('addForm').hidden = true; });
  $('aSave').addEventListener('click', function(){
    var rec = { date:$('aDate').value, area:$('aArea').value, section:$('aSection').value.trim(),
                elementId:$('aElement').value.trim(), activity:$('aActivity').value.trim(),
                manpower:Number($('aManpower').value)||0 };
    if (!rec.date){ toast('Pick a date.'); return; }
    if (!rec.activity){ toast('Enter the activity.'); return; }
    if (!(window.google && google.script && google.script.run)){
      var nr = (ACTS.reduce(function(m,x){return Math.max(m,x._row||1);},1))+1;
      ACTS.push({_row:nr, date:rec.date, area:rec.area, section:rec.section, elementId:rec.elementId,
        activity:rec.activity, manpower:rec.manpower});
      $('addForm').hidden=true; render(); toast('Added (local)'); return;
    }
    $('aSave').disabled=true; $('aSave').textContent='Adding…';
    google.script.run
      .withSuccessHandler(function(){ $('aSave').disabled=false; $('aSave').textContent='Add';
        $('addForm').hidden=true; toast('Activity added.'); reloadData(); })
      .withFailureHandler(function(e){ $('aSave').disabled=false; $('aSave').textContent='Add';
        toast('Add failed: ' + (e && e.message || e)); })
      .addActivity(rec);
  });

  // Re-fetch from the sheet after add/delete (row numbers shift), keep filters.
  function reloadData(){
    if (!(window.google && google.script && google.script.run)){ render(); return; }
    var from=$('fFrom').value, to=$('fTo').value, area=$('fArea').value, q=$('fSearch').value;
    google.script.run
      .withSuccessHandler(function(rep){
        editingRow=null; onData(rep);
        if (from) $('fFrom').value=from; if (to) $('fTo').value=to;
        if (area) $('fArea').value=area; $('fSearch').value=q;
        render();
      })
      .withFailureHandler(function(e){ toast('Reload failed: ' + (e && e.message || e)); })
      .getReport();
  }

  function saveEdit(rowId, tr){
    var a = actByRow(rowId); if(!a) return;
    var areaEl = tr.querySelector('.e-area');
    var newArea = areaEl ? areaEl.value : a.area;
    var newSec = tr.querySelector('.e-sec').value;
    var elemEl = tr.querySelector('.e-elem');
    var newElem = elemEl ? elemEl.value.trim() : a.elementId;
    var newAct = tr.querySelector('.e-act').value;
    var newMp  = Number(tr.querySelector('.e-mp').value) || 0;
    var edit = { row: rowId, date: a.date, area: newArea, section: newSec, elementId: newElem,
      activity: newAct, manpower: newMp,
      orig: { section: a.section, activity: a.activity, manpower: a.manpower } };
    tr.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
    if (!(window.google && google.script && google.script.run)){
      // Offline/mock: just update in memory.
      a.area=newArea; a.section=newSec; a.elementId=newElem; a.activity=newAct; a.manpower=newMp;
      editingRow=null; render(); toast('Saved (local)'); return;
    }
    google.script.run
      .withSuccessHandler(function(total){
        a.area=newArea; a.section=newSec; a.elementId=newElem; a.activity=newAct; a.manpower=newMp;
        editingRow=null;
        // keep the KPI's manpower in sync with the recomputed total from the server
        var p = prodForDate(a.date); if (p && typeof total==='number') p.totalManpower = total;
        render(); toast('Saved.');
      })
      .withFailureHandler(function(e){
        tr.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
        toast('Save failed: ' + (e && e.message || e));
      })
      .saveActivityEdit(edit);
  }

  function renderConcreteChart(dates){
    if (typeof Chart === 'undefined') return;
    // Show the selected day(s); for a single day, show the last 7 days for context.
    var days = (dates && dates.length > 1) ? dates : ALL_DATES.slice(-7);
    var labels = days.map(function(d){ return fmtDate(d).replace(/ \d{4}$/,''); }); // "22 Aug"
    var vals = days.map(function(d){ var p=prodForDate(d); return p ? (p.concreteM3||0) : 0; });
    if (concreteChart) concreteChart.destroy();
    var ctx = $('concreteChart').getContext('2d');
    concreteChart = new Chart(ctx, {
      type:'bar',
      data:{ labels:labels, datasets:[{ label:'Concrete m³', data:vals,
        backgroundColor:cssVar('--con'), borderRadius:4 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ y:{ beginAtZero:true, ticks:{color:cssVar('--ink2')}, grid:{color:cssVar('--grid')} },
                 x:{ ticks:{color:cssVar('--ink2')}, grid:{display:false} } } }
    });
  }

  function renderStructChart(p){
    if (typeof Chart === 'undefined') return;
    var data=[p.dWallCount||0,p.bPileCount||0,p.bWallCount||0,p.cWallCount||0];
    if (structChart) structChart.destroy();
    var ctx = $('structChart').getContext('2d');
    structChart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels:['DW','BP','BT','CW'],
        datasets:[{ data:data,
          backgroundColor:[cssVar('--dw'),cssVar('--bp'),cssVar('--bt'),cssVar('--cw')],
          borderColor:cssVar('--surface'), borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:'bottom', labels:{color:cssVar('--ink2')}} } }
    });
  }

  load();
</script>
