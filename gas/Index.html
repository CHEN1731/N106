<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- JSZip: unzip the .docx in the browser so only its (small) text is used,
         no matter how big the file — avoids the google.script.run payload limit. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <?!= include('Styles'); ?>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>N106 · WhatsApp Site Record Accuracy</h1>
        <p class="sub">Upload RTO chat + AIS report, pick the report date, then Compare. Saving accumulates by date — upload a new day anytime.</p>
      </div>
      <div class="actions">
        <label class="datepick">Report date
          <input type="date" id="reportDate">
        </label>
        <button id="btnCompare" class="primary">Compare</button>
        <button id="btnSave" disabled>Save to Sheet</button>
      </div>
    </header>

    <section class="panes">
      <div class="pane">
        <div class="pane-head">
          <span class="tag rto">RTO</span>
          <label class="file">Upload .txt<input type="file" id="fileRto" accept=".txt"></label>
        </div>
        <textarea id="rtoText" spellcheck="false" placeholder="Paste the RTO WhatsApp export here…"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <span class="tag samsung">AIS Daily Report</span>
          <label class="file">Upload Word / .txt<input type="file" id="fileSamsung" accept=".docx,.doc,.txt"></label>
        </div>
        <textarea id="samsungText" spellcheck="false" placeholder="Upload the AIS Daily Report (.docx) — its text appears here, editable — or paste it…"></textarea>
        <div class="filenote" id="aisNote"></div>
      </div>
    </section>

    <section id="results" class="results hidden">
      <div class="scorecards">
        <div class="card"><div class="num" id="scDW">–</div><div class="lbl">DW</div></div>
        <div class="card"><div class="num" id="scBP">–</div><div class="lbl">BP</div></div>
        <div class="card"><div class="num" id="scBT">–</div><div class="lbl">BT</div></div>
        <div class="card"><div class="num" id="scCW">–</div><div class="lbl">CW</div></div>
        <div class="card"><div class="num" id="scCon">–</div><div class="lbl">Concrete m³</div></div>
        <div class="card"><div class="num" id="scMP">–</div><div class="lbl">Manpower</div></div>
      </div>
      <p id="parseNote" class="note"></p>

      <div class="tablewrap">
        <table id="cmpTable">
          <thead>
            <tr><th>Area</th><th>Section</th><th>Activity</th><th>Manpower</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <?!= include('JavaScript'); ?>
  </body>
</html>
