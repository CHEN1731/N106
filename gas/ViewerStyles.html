<style>
  :root{
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --dw:#2a78d6; --bp:#eb6834; --bt:#1baf7a; --cw:#eda100; --mp:#7c3aed; --con:#256abf;
    --dw-bg:#eaf2fc; --bp-bg:#fcece4; --bt-bg:#e6f6ef; --cw-bg:#fcf3da; --mp-bg:#f0ebfb; --con-bg:#e9f0fb;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19;
      --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --dw:#3987e5; --bp:#d95926; --bt:#199e70; --cw:#c98500; --mp:#9085e9; --con:#3987e5;
      --dw-bg:#12203a; --bp-bg:#2c1a10; --bt-bg:#0e2a20; --cw-bg:#2c2410; --mp-bg:#1e1a33; --con-bg:#12203a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1140px;margin:0 auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  .note{color:var(--ink2);font-size:12.5px;margin:2px 0 0}
  .badge{font-size:11px;color:var(--ink2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
  button{border:1px solid var(--border);background:var(--surface);color:var(--ink);
    padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer}

  .filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}
  .filters label{font-size:12.5px;color:var(--ink2)}
  select,input[type=search]{margin-left:6px;padding:6px 9px;border-radius:8px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
    border-left:4px solid var(--grid)}
  .kpi.dw{border-left-color:var(--dw)} .kpi.bp{border-left-color:var(--bp)}
  .kpi.bt{border-left-color:var(--bt)} .kpi.cw{border-left-color:var(--cw)}
  .kpi.mp{border-left-color:var(--mp)} .kpi.con{border-left-color:var(--con)}
  .kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .k{color:var(--ink2);font-size:12px;margin-top:2px}

  .row2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .panel h2{font-size:13px;margin:0 0 4px;font-weight:600}
  .panel .sub{color:var(--muted);font-size:11.5px;margin:0 0 10px}
  .chartbox{position:relative;height:260px}

  .actwrap{margin-top:12px}
  .areagroup{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden}
  .areagroup > h3{font-size:13px;margin:0;padding:10px 14px;background:var(--grid);color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  .tablewrap{overflow-x:auto}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:top}
  th{color:var(--ink2);font-weight:600;white-space:nowrap}
  td.act{white-space:pre-wrap;word-break:break-word;min-width:280px}
  td.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
  th.acts,td.acts{white-space:nowrap;text-align:right;width:1%}
  .empty{color:var(--muted);font-size:12.5px;padding:12px 14px}

  /* inline edit */
  td .e-edit,td .e-save,td .e-cancel{padding:4px 9px;font-size:12px;border-radius:6px}
  td .e-save{background:var(--bt);border-color:var(--bt);color:#fff}
  tr.editing td{background:var(--cw-bg)}
  tr.editing input{width:100%;padding:5px 7px;border-radius:6px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font:inherit}
  tr.editing input.e-mp{width:80px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20}
  .hidden{display:none}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.row2{grid-template-columns:1fr}}
  @media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
