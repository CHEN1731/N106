<style>
  :root{
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --dw:#2a78d6; --bp:#eb6834; --bt:#1baf7a; --cw:#eda100; --mp:#7c3aed; --con:#256abf;
    --dw-bg:#eaf2fc; --bp-bg:#fcece4; --bt-bg:#e6f6ef; --cw-bg:#fcf3da; --mp-bg:#f0ebfb; --con-bg:#e9f0fb;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19;
      --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --dw:#3987e5; --bp:#d95926; --bt:#199e70; --cw:#c98500; --mp:#9085e9; --con:#3987e5;
      --dw-bg:#12203a; --bp-bg:#2c1a10; --bt-bg:#0e2a20; --cw-bg:#2c2410; --mp-bg:#1e1a33; --con-bg:#12203a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1140px;margin:0 auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  .note{color:var(--ink2);font-size:12.5px;margin:2px 0 0}
  .badge{font-size:11px;color:var(--ink2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
  button{border:1px solid var(--border);background:var(--surface);color:var(--ink);
    padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer}

  .filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}
  .filters label{font-size:12.5px;color:var(--ink2)}
  select,input[type=search]{margin-left:6px;padding:6px 9px;border-radius:8px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px}
  button.linky{padding:6px 11px;font-size:12.5px}

  /* Tab navigation */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 16px;border-bottom:1px solid var(--grid)}
  .tabbtn{border:none;background:none;color:var(--ink2);padding:9px 15px;border-radius:8px 8px 0 0;
    font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
  .tabbtn:hover{color:var(--ink);background:var(--surface)}
  .tabbtn.active{color:var(--ink);border-bottom-color:var(--dw)}
  .tabpage{display:none}
  .tabpage.active{display:block}

  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
    border-left:4px solid var(--grid)}
  .kpi.dw{border-left-color:var(--dw)} .kpi.bp{border-left-color:var(--bp)}
  .kpi.bt{border-left-color:var(--bt)} .kpi.cw{border-left-color:var(--cw)}
  .kpi.mp{border-left-color:var(--mp)} .kpi.con{border-left-color:var(--con)}
  .kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .k{color:var(--ink2);font-size:12px;margin-top:2px}

  .row2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
  .stagepanel{margin-top:12px}
  .stg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;
    background:var(--grid);color:var(--ink2);white-space:nowrap}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .panel h2{font-size:13px;margin:0 0 4px;font-weight:600}
  .panel .sub{color:var(--muted);font-size:11.5px;margin:0 0 10px}
  .chartbox{position:relative;height:260px}

  button.primary{background:var(--dw);border-color:var(--dw);color:#fff}
  .actwrap{margin-top:12px}
  .acthead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .addform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--grid)}
  .addform label{display:flex;flex-direction:column;font-size:11.5px;color:var(--ink2);gap:3px}
  .addform label.grow{flex:1;min-width:200px}
  .addform input,.addform select{margin:0;padding:6px 9px;border-radius:8px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px}
  .addform label.grow input{width:100%}
  td .e-del{padding:4px 9px;font-size:12px;border-radius:6px;margin-left:4px}
  .areagroup{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden}
  .areagroup > h3{font-size:13px;margin:0;padding:10px 14px;background:var(--grid);color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  .tablewrap{overflow-x:auto}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:top}
  th{color:var(--ink2);font-weight:600;white-space:nowrap}
  td.act{white-space:pre-wrap;word-break:break-word;min-width:280px}
  td.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
  th.acts,td.acts{white-space:nowrap;text-align:right;width:1%}
  .empty{color:var(--muted);font-size:12.5px;padding:12px 14px}
  .info{cursor:help;font-size:12px;opacity:.85}

  /* per-area KPI back-check badges */
  .kpirow{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--grid)}
  .kbadge{font:inherit;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);color:var(--ink)}
  .kbadge.stat{cursor:default;font-weight:600;color:var(--ink2)}
  .kbadge.dw{border-left:3px solid var(--dw)} .kbadge.bp{border-left:3px solid var(--bp)}
  .kbadge.bt{border-left:3px solid var(--bt)} .kbadge.cw{border-left:3px solid var(--cw)}
  .kbadge.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .kfilter{padding:8px 14px;font-size:12px;color:var(--ink2);background:var(--cw-bg);border-bottom:1px solid var(--grid)}
  .kfilter .kclear{font:inherit;font-size:11.5px;padding:3px 9px;border-radius:6px;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);margin-left:6px}

  /* inline edit */
  td .e-edit,td .e-save,td .e-cancel{padding:4px 9px;font-size:12px;border-radius:6px}
  td .e-save{background:var(--bt);border-color:var(--bt);color:#fff}
  tr.editing td{background:var(--cw-bg)}
  .editrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .editrow label{display:flex;flex-direction:column;font-size:11px;color:var(--ink2);gap:3px}
  .editrow label.grow{flex:1;min-width:200px}
  .editrow .edate{align-self:center;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .editrow input,.editrow select{padding:5px 7px;border-radius:6px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font:inherit;margin:0}
  .editrow label.grow input{width:100%}
  .editrow input.e-mp{width:80px}

  /* ===== Resource & Production (3 pillars) ===== */
  .respanel{margin-top:12px}
  /* Site Machine Layout — KPI cards at the top */
  .sitebanner{margin:16px 0 4px;border-left:4px solid var(--dw)}
  .marea{margin-top:12px}
  .marea:first-child{margin-top:2px}
  .mareahead{font-size:12.5px;font-weight:700;color:var(--ink);padding:6px 10px;border-radius:8px;
    background:var(--grid);display:flex;align-items:center;gap:8px}
  .marea-idle .mareahead{color:var(--muted);background:transparent;border:1px dashed var(--border)}
  .mareacount{font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--surface);
    border:1px solid var(--border);border-radius:999px;padding:0 7px;min-width:18px;text-align:center}
  .marea .sitegrid{margin-top:8px}
  /* Daily/Weekly/Monthly segmented toggle */
  .seg{display:inline-flex;gap:2px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--plane)}
  .segbtn{border:none;background:none;color:var(--ink2);padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer}
  .segbtn:hover{color:var(--ink)}
  .segbtn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .sitegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:6px}
  .machcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    border-left:4px solid var(--grid);display:flex;flex-direction:column;gap:6px}
  .machcard.st-active{border-left-color:var(--bt)}
  .machcard.st-maint{border-left-color:#e5484d}
  .machcard.st-idle{border-left-color:var(--muted);opacity:.72}
  .machcard .mtop{display:flex;align-items:center;gap:6px}
  .statusdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
  .st-active .statusdot{background:var(--bt)}
  .st-maint .statusdot{background:#e5484d}
  .st-idle .statusdot{background:var(--muted)}
  .machcard .mtitle{font-weight:700;font-size:13px}
  .machcard .mstat{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;text-transform:uppercase;letter-spacing:.03em}
  .st-active .mstat{background:var(--bt)}
  .st-maint .mstat{background:#e5484d}
  .st-idle .mstat{background:var(--muted)}
  .machcard .mareabadge{align-self:flex-start;font-size:11px;font-weight:600;color:var(--ink2);
    background:var(--grid);border-radius:6px;padding:2px 8px}
  /* element rows (📌 id ➔ [lifecycle badge]) */
  .machcard .elbody{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--grid);padding-top:6px}
  .machcard .midlabel{color:var(--muted);font-size:11px}
  .elrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .elid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700}
  .elarrow{color:var(--muted)}
  .eldepth{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;
    background:var(--grid);color:var(--muted);font-variant-numeric:tabular-nums}
  .elidle{color:var(--muted);font-size:11.5px;font-style:italic}
  .lcbadge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;color:#fff}
  .lcbadge.lc-exc{background:#b45309}   /* amber/brown — Excavation */
  .lcbadge.lc-rebar{background:var(--dw)} /* blue — Rebar */
  .lcbadge.lc-conc{background:var(--bp)}  /* orange — Concreting */
  .lcbadge.lc-done{background:var(--bt)}  /* green — Completed */

  table.excav th,table.excav td{padding:8px 12px}
  .excav .depthwrap{display:flex;align-items:center;gap:8px;min-width:120px}
  .excav .depthbar{flex:1;height:8px;border-radius:999px;background:var(--grid);overflow:hidden}
  .excav .depthbar>span{display:block;height:100%;background:var(--dw);border-radius:999px}
  .excav .depthval{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  table.excav th.num,table.excav td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .excav .zsub{color:var(--muted);font-weight:400;font-size:11px}
  .excav tr.totalrow td{border-top:2px solid var(--grid);font-weight:700}

  .rchead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .rckpi{text-align:right}
  .rckpi .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--con)}
  .rckpi .k{color:var(--ink2);font-size:11px}
  .rclist{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
  .rcitem{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--plane)}
  .rcitem .rcloc{font-weight:700;font-size:12px;min-width:74px;font-variant-numeric:tabular-nums}
  .rcitem .rcact{font-size:12px;color:var(--ink2);flex:1;line-height:1.35}
  .rcbadge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;color:#fff}
  .rcbadge.rc-rebar{background:var(--dw)}
  .rcbadge.rc-form{background:var(--bp)}
  .rcbadge.rc-conc{background:#4b5563}
  .resempty{color:var(--muted);font-size:12px;padding:10px 2px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20}
  .hidden{display:none}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.row2{grid-template-columns:1fr}}
  @media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
